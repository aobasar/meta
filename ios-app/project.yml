# Generate the Xcode project with `xcodegen` (the .xcodeproj is git-ignored).
name: NovaGuide
options:
  bundleIdPrefix: com.aobasar.nova
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  NovaGuide:
    type: application
    platform: iOS
    sources:
      - path: NovaGuide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aobasar.nova.guide
        PRODUCT_NAME: NovaGuide
        INFOPLIST_KEY_CFBundleDisplayName: Kokobubu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: NovaGuide/Info.plist
      properties:
        CFBundleDisplayName: Kokobubu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, tr]
        LSRequiresIPhoneOS: true
        CFBundleURLTypes:
          - CFBundleURLName: com.aobasar.nova.guide.invite
            CFBundleURLSchemes: [kokobubu]
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiredDeviceCapabilities: [arkit]
        NSCameraUsageDescription: "Kokobubu uses the camera to see the device in front of you and show you which control to touch."
        NSMicrophoneUsageDescription: "Kokobubu listens only after you tap the microphone, so you can ask and answer by voice."
        NSPhotoLibraryAddUsageDescription: "Kokobubu saves a screen recording to Photos only when you tap Save to Photos."
        NSLocalNetworkUsageDescription: "Kokobubu connects to the Kokobubu server on your own Mac."
        NovaPublicURL: $(NOVA_PUBLIC_URL)
  NovaGuideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NovaGuideTests
    dependencies:
      - target: NovaGuide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aobasar.nova.guide.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NovaGuide.app/NovaGuide
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  NovaGuide:
    build:
      targets:
        NovaGuide: all
        NovaGuideTests: [test]
    test:
      targets:
        - NovaGuideTests
