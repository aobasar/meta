# Generate the Xcode project with `xcodegen` (the .xcodeproj is git-ignored).
name: Kokobubu
options:
  bundleIdPrefix: com.aobasar
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Kokobubu:
    type: application
    platform: iOS
    sources:
      - path: NovaGuide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aobasar.kokobubu
        PRODUCT_NAME: Kokobubu
        APP_DISPLAY_NAME: Kokobubu
        APP_URL_SCHEME: kokobubu
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      # The maintainer's own build sits beside the TestFlight one on the phone, and looks different.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.aobasar.kokobubu.dev
          APP_DISPLAY_NAME: Kokobubu Dev
          APP_URL_SCHEME: kokobubu-dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
    info:
      path: NovaGuide/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, tr]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        CFBundleURLTypes:
          - CFBundleURLName: com.aobasar.kokobubu.invite
            CFBundleURLSchemes: [$(APP_URL_SCHEME)]
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiredDeviceCapabilities: [arkit]
        NSCameraUsageDescription: "Kokobubu uses the camera to see the device in front of you and show you which control to touch."
        NSMicrophoneUsageDescription: "Kokobubu listens only after you tap the microphone, so you can ask and answer by voice."
        NSPhotoLibraryAddUsageDescription: "Kokobubu saves a screen recording to Photos only when you tap Save to Photos."
        NovaPublicURL: $(NOVA_PUBLIC_URL)
    # Settings shows which commit and when, so a new install can be told from the old one.
    postBuildScripts:
      - name: Stamp the build
        basedOnDependencyAnalysis: false
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          commit=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo unknown)
          if [ -n "$(git -C "$SRCROOT" status --porcelain -- . ../web-prototype/guide.py 2>/dev/null)" ]; then commit="$commit+"; fi
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for pair in "KokobubuCommit:$commit" "KokobubuBuilt:$built"; do
            key=${pair%%:*}; value=${pair#*:}
            /usr/libexec/PlistBuddy -c "Delete :$key" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist" || true
          done
  KokobubuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NovaGuideTests
    dependencies:
      - target: Kokobubu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aobasar.kokobubu.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Kokobubu.app/Kokobubu
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Kokobubu:
    build:
      targets:
        Kokobubu: all
        KokobubuTests: [test]
    test:
      targets:
        - KokobubuTests
